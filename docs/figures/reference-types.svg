<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Four referring-expression strata</title>
  <desc id="desc">Schematic examples of direct, absolute-position, relational, and logical referring expressions. A purple outline marks the target object.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; }
    .panel { fill: #faf9f7; stroke: #d7d4cf; stroke-width: 2; }
    .scene { fill: #ffffff; stroke: #e7e3dd; stroke-width: 2; }
    .target { fill: none; stroke: #6d4aff; stroke-width: 6; }
    .object { fill: #d9d6d0; stroke: #78736c; stroke-width: 2; }
    .red { fill: #e56b62; }
    .blue { fill: #77a9d8; }
    .dark { fill: #56534f; }
    .heading { font-size: 24px; font-weight: 600; }
    .expression { font-size: 21px; }
    .note { font-size: 17px; fill: #625d57; }
  </style>

  <rect class="panel" x="20" y="20" width="280" height="610" rx="16"/>
  <text class="heading" x="44" y="62">Direct retrieval</text>
  <text class="expression" x="44" y="100">“the red cup”</text>
  <rect class="scene" x="44" y="130" width="232" height="340" rx="10"/>
  <path class="object blue" d="M75 255 h45 l-7 80 h-31 z"/>
  <path class="object red" d="M139 255 h45 l-7 80 h-31 z"/>
  <path class="object" d="M203 255 h45 l-7 80 h-31 z"/>
  <rect class="target" x="130" y="243" width="63" height="104" rx="8"/>
  <text class="note" x="44" y="510">Object + appearance cue</text>
  <text class="note" x="44" y="538">No structural operator</text>

  <rect class="panel" x="313" y="20" width="280" height="610" rx="16"/>
  <text class="heading" x="337" y="62">Absolute position</text>
  <text class="expression" x="337" y="100">“person in background”</text>
  <rect class="scene" x="337" y="130" width="232" height="340" rx="10"/>
  <circle class="object" cx="390" cy="220" r="20"/>
  <path class="object" d="M372 244 h36 l10 76 h-56 z"/>
  <circle class="object dark" cx="500" cy="325" r="30"/>
  <path class="object dark" d="M472 360 h56 l17 94 h-90 z"/>
  <rect class="target" x="357" y="187" width="67" height="145" rx="8"/>
  <text class="note" x="337" y="510">Location within whole image</text>
  <text class="note" x="337" y="538">No anchor object needed</text>

  <rect class="panel" x="606" y="20" width="280" height="610" rx="16"/>
  <text class="heading" x="630" y="62">Relational</text>
  <text class="expression" x="630" y="100">“cup beside laptop”</text>
  <rect class="scene" x="630" y="130" width="232" height="340" rx="10"/>
  <rect class="object dark" x="688" y="220" width="115" height="82" rx="6"/>
  <path class="object dark" d="M675 312 h140 l18 19 h-176 z"/>
  <path class="object red" d="M819 260 h28 l-5 58 h-18 z"/>
  <path class="object blue" d="M650 365 h32 l-5 64 h-22 z"/>
  <rect class="target" x="810" y="249" width="46" height="80" rx="8"/>
  <text class="note" x="630" y="510">Target depends on anchor</text>
  <text class="note" x="630" y="538">Cross-object relation</text>

  <rect class="panel" x="899" y="20" width="280" height="610" rx="16"/>
  <text class="heading" x="923" y="62">Logical operator</text>
  <text class="expression" x="923" y="100">“second from right”</text>
  <rect class="scene" x="923" y="130" width="232" height="340" rx="10"/>
  <g class="object">
    <circle cx="960" cy="258" r="17"/><path d="M945 279 h30 l8 77 h-46 z"/>
    <circle cx="1014" cy="258" r="17"/><path d="M999 279 h30 l8 77 h-46 z"/>
    <circle cx="1068" cy="258" r="17"/><path d="M1053 279 h30 l8 77 h-46 z"/>
    <circle cx="1122" cy="258" r="17"/><path d="M1107 279 h30 l8 77 h-46 z"/>
  </g>
  <rect class="target" x="1043" y="230" width="50" height="138" rx="8"/>
  <text class="note" x="923" y="510">Ordinal, comparison, count,</text>
  <text class="note" x="923" y="538">or explicit negation</text>

  <line x1="44" y1="582" x2="1155" y2="582" stroke="#d7d4cf" stroke-width="2"/>
  <rect x="44" y="598" width="22" height="16" class="target" rx="3"/>
  <text class="note" x="78" y="612">Purple outline = ground-truth target. These scenes are schematic, not dataset photographs.</text>
</svg>
